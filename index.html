<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist Ambulância - Curral de Cima</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#172033;
}
.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}
.header{
  background:#075985;
  color:white;
  border-radius:12px;
  padding:20px;
  text-align:center;
}
.header h1{font-size:20px;margin:5px 0}
.header h2{font-size:16px;margin:5px 0}
.header p{margin:8px 0 0;font-size:13px}

.card{
  background:white;
  margin-top:15px;
  padding:15px;
  border-radius:12px;
  box-shadow:0 2px 8px #0002;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #bbb;
  border-radius:8px;
  font-size:16px;
  margin-top:5px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.summary{
  display:flex;
  justify-content:space-around;
  text-align:center;
  font-weight:bold;
  margin-top:15px;
}
.summary div{
  background:#e2e8f0;
  padding:10px;
  border-radius:8px;
  flex:1;
  margin:3px;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-weight:bold;
  cursor:pointer;
}

.top-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}
.btn-ok{background:#16a34a;color:white}
.btn-clear{background:#64748b;color:white}
.btn-print{background:#0f766e;color:white}

.category{
  margin-top:18px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  overflow:hidden;
}
.category-title{
  background:#075985;
  color:white;
  padding:10px;
  font-weight:bold;
}

.item{
  padding:12px;
  border-top:1px solid #e2e8f0;
  background:white;
}
.item-name{
  font-weight:bold;
  margin-bottom:8px;
}
.options{
  display:flex;
  gap:8px;
}
.sim,.nao{
  flex:1;
  background:#e2e8f0;
  color:#172033;
}
.sim.selected{
  background:#16a34a;
  color:white;
}
.nao.selected{
  background:#dc2626;
  color:white;
}
.options button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.obs{
  display:none;
  margin-top:8px;
}
.obs.show{display:block}
.obs textarea{
  width:100%;
  min-height:70px;
  padding:8px;
  border:1px solid #dc2626;
  border-radius:8px;
  resize:vertical;
}

@media(max-width:600px){
  .info{grid-template-columns:1fr}
  .summary{font-size:13px}
}

@media print{
  .top-buttons,.options,.obs textarea{
    display:none!important;
  }
  body{background:white}
  .card,.category{box-shadow:none}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div style="font-size:35px">🏥</div>
  <h1>PREFEITURA MUNICIPAL DE CURRAL DE CIMA</h1>
  <h2>SECRETARIA MUNICIPAL DE SAÚDE</h2>
  <p>CHECK LIST — AMBULÂNCIA TIPO A</p>
  <p id="dataHora"></p>
</div>

<div class="card">

<div class="info">
  <div>
    <label><b>Placa da ambulância</b></label>
    <input id="placa" placeholder="Digite a placa">
  </div>

  <div>
    <label><b>Responsável pela conferência</b></label>
    <input id="responsavel" placeholder="Nome do responsável">
  </div>
</div>

<div class="top-buttons">
  <button class="btn-ok" onclick="marcarTodos()">✓ Marcar todos SIM</button>
  <button class="btn-clear" onclick="limpar()">Limpar checklist</button>
  <button class="btn-print" onclick="imprimir()">🖨️ Salvar / Imprimir</button>
</div>

<div class="summary">
  <div>Total<br><span id="total">0</span></div>
  <div>SIM<br><span id="simCount">0</span></div>
  <div>NÃO<br><span id="naoCount">0</span></div>
</div>

<div id="checklist"></div>

</div>
</div>

<script>

const categorias = [

{
nome:"COMPARTIMENTO COM TELA 01",
itens:[
"Ambu adulto — 01",
"Ambu pediátrico — 01"
]
},

{
nome:"COMPARTIMENTO COM TELA 02",
itens:[
"SF 0,9% 500 mL — 05",
"Soro RL 500 mL — 05",
"SG 5% 500 mL — 05",
"Jelco 14, 16, 18, 20, 22 e 24 — 05 de cada",
"Scalpe — 05",
"Seringas 01, 03, 05, 10 e 20 mL — 05 de cada",
"Equipo macrogotas — 10",
"Lâmina de bisturi — 05"
]
},

{
nome:"COMPARTIMENTO COM TELA 03",
itens:[
"Máscara com reservatório adulta — 01",
"Máscara com reservatório infantil — 01",
"Cânula de Guedel — 02",
"Cateter nasal — 05",
"Látex / extensão de O₂ — 03",
"Máscara de nebulização — 01",
"Máscara de Venturi — 01"
]
},

{
nome:"MONITORIZAÇÃO E AVALIAÇÃO",
itens:[
"Oxímetro — 01",
"Termômetro — 01",
"Estetoscópio adulto — 01",
"Estetoscópio infantil — 01",
"Tensiômetro adulto — 01",
"Tensiômetro infantil — 01"
]
},

{
nome:"MATERIAIS DE TRAUMA",
itens:[
"Manta térmica — 02",
"Protetor de queimados e evisceração — 01",
"Gaze — 10",
"Atadura — 10"
]
},

{
nome:"COMPARTIMENTO FECHADO SUPERIOR",
itens:[
"Colcha — 01",
"Lençol descartável — 10",
"Kit parto — 01",
"Lençol — 02",
"Fralda descartável — 01"
]
},

{
nome:"COMPARTIMENTO FECHADO INFERIOR 01",
itens:[
"Colar cervical: neonatal, infantil, P, M e G, regulável — 01 de cada",
"Coxins — 01 par",
"Luva P, M e G — 01 de cada",
"Máscara descartável — 01 cx",
"Esparadrapo — 01",
"Cuba rim — 01",
"Almotolia álcool — 01",
"Almotolia PVPI — 01"
]
},

{
nome:"COMPARTIMENTO FECHADO INFERIOR 02",
itens:[
"KED adulto — 01"
]
},

{
nome:"VIATURA",
itens:[
"Garrote — 02"
]
}

];

let respostas={};

function criarChecklist(){

const area=document.getElementById("checklist");
area.innerHTML="";
let total=0;

categorias.forEach((categoria,ci)=>{

const bloco=document.createElement("div");
bloco.className="category";

const titulo=document.createElement("div");
titulo.className="category-title";
titulo.textContent=categoria.nome;
bloco.appendChild(titulo);

categoria.itens.forEach((item,ii)=>{

total++;

const id=ci+"-"+ii;

const div=document.createElement("div");
div.className="item";

div.innerHTML=`
<div class="item-name">${item}</div>

<div class="options">

<button class="sim" id="sim-${id}"
onclick="responder('${id}','SIM')">
SIM
</button>

<button class="nao" id="nao-${id}"
onclick="responder('${id}','NAO')">
NÃO
</button>

</div>

<div class="obs" id="obs-${id}">
<textarea id="txt-${id}"
placeholder="Digite a observação obrigatória..."></textarea>
</div>
`;

bloco.appendChild(div);

});

area.appendChild(bloco);

});

document.getElementById("total").textContent=total;

}

function responder(id,resposta){

const sim=document.getElementById("sim-"+id);
const nao=document.getElementById("nao-"+id);
const obs=document.getElementById("obs-"+id);
const txt=document.getElementById("txt-"+id);

if(respostas[id]===resposta){

delete respostas[id];

sim.classList.remove("selected");
nao.classList.remove("selected");

sim.disabled=false;
nao.disabled=false;

obs.classList.remove("show");
txt.value="";

}else{

respostas[id]=resposta;

if(resposta==="SIM"){

sim.classList.add("selected");
nao.classList.remove("selected");

sim.disabled=false;
nao.disabled=true;

obs.classList.remove("show");
txt.value="";

}else{

nao.classList.add("selected");
sim.classList.remove("selected");

nao.disabled=false;
sim.disabled=true;

obs.classList.add("show");
txt.focus();

}

}

atualizarResumo();

}

function atualizarResumo(){

let sim=0;
let nao=0;

Object.values(respostas).forEach(r=>{
if(r==="SIM") sim++;
if(r==="NAO") nao++;
});

document.getElementById("simCount").textContent=sim;
document.getElementById("naoCount").textContent=nao;

}

function marcarTodos(){

categorias.forEach((categoria,ci)=>{
categoria.itens.forEach((item,ii)=>{

const id=ci+"-"+ii;

respostas[id]="SIM";

document.getElementById("sim-"+id).classList.add("selected");
document.getElementById("nao-"+id).classList.remove("selected");

document.getElementById("sim-"+id).disabled=false;
document.getElementById("nao-"+id).disabled=true;

document.getElementById("obs-"+id).classList.remove("show");

});

});

atualizarResumo();

}

function limpar(){

if(!confirm("Deseja realmente limpar todo o checklist?")) return;

respostas={};

document.querySelectorAll(".sim,.nao").forEach(btn=>{
btn.classList.remove("selected");
btn.disabled=false;
});

document.querySelectorAll(".obs").forEach(o=>{
o.classList.remove("show");
});

document.querySelectorAll("textarea").forEach(t=>{
t.value="";
});

atualizarResumo();

}

function imprimir(){

let faltando=[];

Object.keys(respostas).forEach(id=>{

if(respostas[id]==="NAO"){

const txt=document.getElementById("txt-"+id);

if(!txt.value.trim()){
faltando.push(id);
}

}

});

if(faltando.length>0){

alert("Preencha a observação dos itens marcados como NÃO.");
return;

}

window.print();

}

function atualizarDataHora(){

const agora=new Date();

document.getElementById("dataHora").textContent=
agora.toLocaleDateString("pt-BR")+" — "+
agora.toLocaleTimeString("pt-BR");

}

document.getElementById("placa").value=
localStorage.getItem("placaAmbulancia")||"";

document.getElementById("responsavel").value=
localStorage.getItem("responsavelAmbulancia")||"";

document.getElementById("placa").addEventListener("input",e=>{
localStorage.setItem("placaAmbulancia",e.target.value);
});

document.getElementById("responsavel").addEventListener("input",e=>{
localStorage.setItem("responsavelAmbulancia",e.target.value);
});

criarChecklist();
atualizarDataHora();

setInterval(atualizarDataHora,1000);

</script>

</body>
</html>
